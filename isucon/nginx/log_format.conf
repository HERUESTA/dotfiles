# alp で集計するための LTSV 形式のアクセスログ
#
# 配置先: /etc/nginx/conf.d/log_format.conf
#   Ubuntu の nginx.conf は http ブロックの中で conf.d/*.conf を読み込むため、
#   ここに置くと log_format が http コンテキストで定義される。
#
# 使い方: 問題ごとのサイト設定の server ブロックに次の1行を書く。
#   access_log /var/log/nginx/access.log ltsv;
#   （http ブロックに書くと nginx.conf 既定の access_log と二重に書き込まれる）

log_format ltsv "time:$time_local"
                "\thost:$remote_addr"
                "\tforwardedfor:$http_x_forwarded_for"
                "\treq:$request"
                "\tmethod:$request_method"
                "\turi:$request_uri"
                "\tstatus:$status"
                "\tsize:$body_bytes_sent"
                "\treferer:$http_referer"
                "\tua:$http_user_agent"
                "\treqtime:$request_time"
                "\tapptime:$upstream_response_time"
                "\tcache:$upstream_http_x_cache"
                "\truntime:$upstream_http_x_runtime"
                "\tvhost:$host";
