customCommands:
  - key: "B"
    context: "global"
    description: "fzf でブランチを曖昧検索して checkout"
    command: |
      bash -lc '
        branches=$(git for-each-ref --sort=-committerdate --format="%(refname:short)" refs/heads refs/remotes | sed -e "/\/HEAD$/d" -e "s#^origin/##" | awk "!seen[\$0]++")
        branch=$(printf "%s\n" "$branches" | fzf --prompt="checkout branch> ")
        if [ -n "$branch" ]; then
          git checkout "$branch"
        fi
      '
    output: terminal

  - key: "<c-g>"
    context: "global"
    description: "現在のブランチの GitHub PR 操作を選択"
    command: |
      bash -lc '
        action=$(printf "%s\n" \
          "view: browser" \
          "view: terminal" \
          "create: browser" \
          "create: terminal" |
          fzf --prompt="pr> ")

        case "$action" in
          "view: browser") gh pr view --web ;;
          "view: terminal") gh pr view ;;
          "create: browser") gh pr create --web ;;
          "create: terminal") gh pr create ;;
        esac
      '
    output: terminal

  # 形式: <絵文字> <type>: <メッセージ>
  # condition を使うため lazygit v0.61.0 以上が必要
  - key: "c"
    context: "files"
    description: "Conventional Commit + gitmoji"
    prompts:
      - type: "menu"
        key: "Type"
        title: "type を選択"
        options:
          - { name: "feat",     description: "✨ 新機能", value: "✨ feat" }
          - { name: "fix",      description: "🐛 バグ修正", value: "🐛 fix" }
          - { name: "docs",     description: "📝 ドキュメント", value: "📝 docs" }
          - { name: "style",    description: "🎨 構造・フォーマット", value: "🎨 style" }
          - { name: "refactor", description: "♻️ リファクタリング", value: "♻️ refactor" }
          - { name: "perf",     description: "⚡️ パフォーマンス改善", value: "⚡️ perf" }
          - { name: "test",     description: "✅ テスト", value: "✅ test" }
          - { name: "build",    description: "📦️ ビルド成果物", value: "📦️ build" }
          - { name: "ci",       description: "👷 CI ビルドシステム", value: "👷 ci" }
          - { name: "chore",    description: "🔧 設定ファイル", value: "🔧 chore" }
          - { name: "revert",   description: "⏪️ 取り消し", value: "⏪️ revert" }
      # type ごとの絵文字の選択。選んだ type のメニューだけが表示される（先頭が既定の絵文字）。
      # key を type ごとに分けているのは、スキップされたメニューの空文字列で選択値を上書きしないため。
      # 候補を増やすときは options に 1 行足す。候補のない type にメニューを足すときは command の printf にも key を足す。
      - type: "menu"
        key: "FeatEmoji"
        title: "feat の絵文字を選択"
        condition: '{{ eq .Form.Type "✨ feat" }}'
        options:
          - { name: "✨", description: "新機能", value: "✨ feat" }
          - { name: "🎉", description: "プロジェクト開始", value: "🎉 feat" }
      - type: "menu"
        key: "FixEmoji"
        title: "fix の絵文字を選択"
        condition: '{{ eq .Form.Type "🐛 fix" }}'
        options:
          - { name: "🐛", description: "バグ修正", value: "🐛 fix" }
          - { name: "🚑️", description: "緊急のホットフィックス", value: "🚑️ fix" }
          - { name: "🩹", description: "軽微な修正", value: "🩹 fix" }
          - { name: "✏️", description: "typo 修正", value: "✏️ fix" }
      - type: "menu"
        key: "DocsEmoji"
        title: "docs の絵文字を選択"
        condition: '{{ eq .Form.Type "📝 docs" }}'
        options:
          - { name: "📝", description: "ドキュメント", value: "📝 docs" }
          - { name: "💡", description: "コード内コメント", value: "💡 docs" }
      - type: "menu"
        key: "StyleEmoji"
        title: "style の絵文字を選択"
        condition: '{{ eq .Form.Type "🎨 style" }}'
        options:
          - { name: "🎨", description: "構造・フォーマット", value: "🎨 style" }
          - { name: "💄", description: "UI・スタイルファイル", value: "💄 style" }
      - type: "menu"
        key: "RefactorEmoji"
        title: "refactor の絵文字を選択"
        condition: '{{ eq .Form.Type "♻️ refactor" }}'
        options:
          - { name: "♻️", description: "リファクタリング", value: "♻️ refactor" }
          - { name: "🏗️", description: "アーキテクチャの変更", value: "🏗️ refactor" }
      - type: "menu"
        key: "TestEmoji"
        title: "test の絵文字を選択"
        condition: '{{ eq .Form.Type "✅ test" }}'
        options:
          - { name: "✅", description: "テスト", value: "✅ test" }
          - { name: "🧪", description: "失敗するテストの追加", value: "🧪 test" }
      - type: "menu"
        key: "BuildEmoji"
        title: "build の絵文字を選択"
        condition: '{{ eq .Form.Type "📦️ build" }}'
        options:
          - { name: "📦️", description: "ビルド成果物", value: "📦️ build" }
          - { name: "⬆️", description: "依存の更新", value: "⬆️ build" }
          - { name: "➕", description: "依存の追加", value: "➕ build" }
          - { name: "➖", description: "依存の削除", value: "➖ build" }
      - type: "menu"
        key: "CiEmoji"
        title: "ci の絵文字を選択"
        condition: '{{ eq .Form.Type "👷 ci" }}'
        options:
          - { name: "👷", description: "CI ビルドシステム", value: "👷 ci" }
          - { name: "💚", description: "CI の修正", value: "💚 ci" }
      - type: "menu"
        key: "ChoreEmoji"
        title: "chore の絵文字を選択"
        condition: '{{ eq .Form.Type "🔧 chore" }}'
        options:
          - { name: "🔧", description: "設定ファイル", value: "🔧 chore" }
          - { name: "🔥", description: "コード・ファイルの削除", value: "🔥 chore" }
          - { name: "⬆️", description: "依存の更新", value: "⬆️ chore" }
      - type: "input"
        key: "Message"
        title: "コミットメッセージ"
    # 表示される絵文字メニューは多くても 1 つなので、全部をつなげると選ばれた値だけが残る。空なら Type の既定を使う。
    # メッセージが空（空白のみを含む）ならコミットせずに中止する。
    # lazygit は $SHELL -c で実行するため、PC ごとにシェルが違っても動くよう POSIX sh の構文だけを使う。
    command: >-
      {{- $type := .Form.Type -}}
      {{- $emoji := printf "%s%s%s%s%s%s%s%s%s" .Form.FeatEmoji .Form.FixEmoji .Form.DocsEmoji .Form.StyleEmoji .Form.RefactorEmoji .Form.TestEmoji .Form.BuildEmoji .Form.CiEmoji .Form.ChoreEmoji -}}
      {{- if $emoji }}{{ $type = $emoji }}{{ end -}}
      if [ -z "$(printf '%s' {{ .Form.Message | quote }} | tr -d '[:space:]')" ]; then
      echo 'コミットメッセージが空のため中止しました' >&2; exit 1;
      fi;
      git commit -m {{ printf "%s: %s" $type .Form.Message | quote }}
